plugins {
    id "com.android.library"
    id "maven-publish"
}

android {
    namespace "biz.binarysolutions.android.edgeinsets"
    compileSdk 37
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {

    // version 1.8.0+ require min SDK 23
    // noinspection GradleDependency
    implementation "androidx.appcompat:appcompat:1.7.1"
    
    // newer versions require min SDK 23
    // noinspection GradleDependency
    implementation "com.google.android.material:material:1.13.0"
}

publishing {
    publications {
        release(MavenPublication) {
            groupId    = "com.github.vbresan"
            artifactId = "edgeinsets"
            version    = "1.0.0"

            afterEvaluate {
                from components.release
            }
        }
    }
}
